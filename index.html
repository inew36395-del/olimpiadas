function side(){$('#sd').innerHTML=`<h1>🏅 Olimpiadas<br><b>UTP 2026</b></h1>${NAV.map(n=>`<a class="${pg==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[0]=='pag'?D.cfg.pag:n[2]}</a>`).join('')}<small>${esc(U.n)}</small><a onclick="sb.auth.signOut().then(()=>location.reload())">↩ Salir</a>`}
function render(){side();$('#mn').innerHTML=P[pg]();const al=alerts().length;$('#bl').textContent='🔔 '+al;$('#pl').innerHTML=D.per.map(x=>`<option value="${esc(x.name)}">`).join('');$('#fl').innerHTML=FAC.map(x=>`<option value="${x}">`).join('');$('#al').innerHTML=D.act.map(x=>`<option value="${esc(x.name)}">`).join('');
if([...D.mov,...D.pay,...D.per,...D.act].some(x=>x.demo&&!x.void)&&!$('#mn').querySelector('.dmb'))$('#mn').insertAdjacentHTML('afterbegin','<div class="al dmb">DATOS DE DEMOSTRACIÓN activos · se pueden eliminar en Configuración</div>')}
function go(p){pg=p;$('#sd').classList.remove('open');if(p!='search')$('#gs').value=Q='';render();scrollTo(0,0)}
async function ent(){const b=$('#lb');b.disabled=true;const r=await sb.auth.signInWithPassword({email:$('#lu').value.trim(),password:$('#lp').value});b.disabled=false;if(r.error)return toast('Correo o contraseña incorrectos',1);await boot()}
async function boot(){const s=(await sb.auth.getSession()).data.session;if(!s)return;try{const p=must(await sb.from('perfiles').select('*').eq('id',s.user.id).single());U={n:p.nombre||s.user.email,r:RM[p.rol]||'col'};await load()}catch(e){return}$('#lg').hidden=true;$('#app').hidden=false;render()}
$('#lg').innerHTML=`<div class=lc><h1>🏅 Olimpiadas Universitarias UTP 2026</h1><p>Gestión administrativa y económica</p><input id=lu type=email placeholder="Correo" autocomplete=username><input id=lp type=password placeholder="Contraseña" onkeydown="if(event.key=='Enter')ent()"><button class="bt p" id=lb onclick=ent()>Ingresar</button><small>Ingrese con el correo y la contraseña que le dio el administrador.</small></div>`;
boot();addEventListener('focus',()=>{if(U)load().then(render).catch(()=>{})});
</script></body></html>
